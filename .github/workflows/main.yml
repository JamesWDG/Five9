name: Build and Deploy Node App
 
on:

  push:

    branches:

      - main
 
jobs:

  build-and-deploy:

    runs-on: ubuntu-latest
 
    steps:

      - name: Checkout code

        uses: actions/checkout@v4
 
      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm
 
      - name: Install dependencies

        run: npm ci
 
      - name: Build app

        run: npm run build
 
      - name: Setup SSH

        uses: webfactory/ssh-agent@v0.9.0

        with:

          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
 
      - name: Add server to known_hosts

        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
 
      - name: Upload files to server

        run: |

          rsync -avz --delete ./dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/dist/
 
      - name: Restart app using PM2

        run: |

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "

            cd ${{ secrets.SERVER_PATH }} &&

            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js &&

            pm2 save

          "
